# Builds the production images (Dockerfile targets api and web) and pushes them to GitHub's registry, for clusters
# that pull images instead of building them (Civo, see deploy/k8s/README.md). Run it from the Actions tab, or push a
# tag like v1.2.0. Needs the repository variable DOMAIN (Settings → Secrets and variables → Actions → Variables):
# the address the web app calls the API on is baked in at build time. The tests don't run again here: master only
# changes through pull requests that passed CI (ci.yml) on a branch up to date with it, so that's what gets built.
name: Images

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ api, web ]
    steps:
      - uses: actions/checkout@v4

      # Just the host name: a stray space or https:// would be baked into the web app and break every API call.
      - name: Check DOMAIN
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || {
            echo "The repository variable DOMAIN must be just the host name, like studylog.example.com (got: '$DOMAIN')"
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<commit> for pinning a version (deploy/civo), latest for the newest build, and the tag's version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/studylog-${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Civo's nodes are x86.
          platforms: linux/amd64
          build-args: VITE_API_URL=https://${{ vars.DOMAIN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
