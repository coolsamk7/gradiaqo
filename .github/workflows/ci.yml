# Lint, build and every test, on each pull request to master. Not again after merging: the master ruleset requires
# both checks to pass on a branch that's up to date with master, so what lands there is what was tested, and what the
# Images workflow builds. Pull requests also get a comment with the coverage.
name: CI

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The coverage comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # Turbo's task cache: a task whose inputs (code, lockfile, config) didn't change since a saved run is replayed,
      # logs and coverage reports included, instead of run again. GitHub shares caches from master with pull requests.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: yarn turbo run lint build
      # Fails below 100% coverage in any package (packages/common/vitest/coverage.js); --continue so every package
      # still reports.
      - id: coverage
        run: yarn turbo run test:cov --concurrency=2 --continue
      # The table, also when coverage dropped: on the run's Summary page, and as one comment on the pull request that
      # each push updates.
      - if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: node scripts/coverage-summary.mjs && cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage/summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/summary.md

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    # The same database and Mailpit as `yarn db:up` (docker-compose.yml); the tests create studylog_e2e in it.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studylog
          POSTGRES_PASSWORD: studylog
          POSTGRES_DB: studylog
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U studylog -d studylog"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mail:
        image: axllent/mailpit:v1.27
        ports: [ "1025:1025", "8025:8025" ]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The builds the UI tests need (the tests themselves always run: turbo.json doesn't cache them).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-ui-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ui-${{ runner.os }}-
      # Chromium, downloaded once per Playwright version; the system libraries it needs are installed every time.
      - id: playwright
        working-directory: apps/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: yarn workspace @studylog/e2e playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: yarn workspace @studylog/e2e playwright install-deps chromium
      - run: yarn test:ui
      # Traces and screenshots of the failed tests: download from the run's Summary page.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14
