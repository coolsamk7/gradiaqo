# Gradiaqo on k3s (see deploy/k8s/README.md). Apply with: kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: studylog

resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml

# Nightly encrypted database backups to OneDrive. Needs backup/rclone.conf and backup/backup.env (see "Backups" in
# README.md). In this kustomization because it reads the database password from studylog-secrets, generated here.
components:
  - backup

# Copied from the *.example files and filled in on the server; both are git-ignored.
# A change to either gets a new name (hash suffix), so the pods using it restart with the new values.
configMapGenerator:
  - name: studylog-config
    envs:
      - config.env
secretGenerator:
  - name: studylog-secrets
    envs:
      - secrets.env

# The address in config.env (DOMAIN) is also the Ingress host and its certificate's name, and www.DOMAIN redirects
# to it. options.index replaces only that part of www.DOMAIN (split at ".") and https://DOMAIN/${1} (split at "/").
replacements:
  - source:
      kind: ConfigMap
      name: studylog-config
      fieldPath: data.DOMAIN
    targets:
      - select:
          kind: Ingress
          name: studylog
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: studylog-www
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
        options:
          delimiter: .
          index: 1
      - select:
          kind: Middleware
          name: redirect-www
        fieldPaths:
          - spec.redirectRegex.replacement
        options:
          delimiter: /
          index: 2
