# PostgreSQL 17, data on the node's disk (k3s local-path storage). Reachable only inside the cluster, as postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: studylog
            - name: POSTGRES_DB
              value: studylog
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studylog-secrets
                  key: POSTGRES_PASSWORD
            # A subfolder, because the volume's root holds lost+found on some disks.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "studylog", "-d", "studylog" ]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "studylog", "-d", "studylog" ]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
