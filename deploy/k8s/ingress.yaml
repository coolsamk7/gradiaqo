# The public entry: Traefik (bundled with k3s) takes ports 80 and 443 and sends everything to the web pod.
# cert-manager gets and renews the Let's Encrypt certificate (cluster/cluster-issuer.yaml).
# The host comes from DOMAIN in config.env (see replacements in kustomization.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studylog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # http:// → https:// (the Middleware below).
    traefik.ingress.kubernetes.io/router.middlewares: studylog-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - DOMAIN
      secretName: studylog-tls
  rules:
    - host: DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# www.DOMAIN, with its own certificate, only sends visitors to https://DOMAIN (the Middleware below), so there is one
# address for search engines and the refresh cookie. Its DNS record must point at the node as DOMAIN's does.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studylog-www
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: studylog-redirect-www@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.DOMAIN
      secretName: studylog-www-tls
  rules:
    - host: www.DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
spec:
  redirectRegex:
    regex: ^https?://www\.[^/]+/(.*)
    replacement: https://DOMAIN/${1}
    permanent: true
