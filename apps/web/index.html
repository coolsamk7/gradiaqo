<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="StudyLog turns any subject into a learning path. Log your study time, track your progress and keep your streak going." />
        <meta name="theme-color" content="#0e0e0c" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
        <title>StudyLog</title>
        <script>
            // The theme before the first paint, so dark pages don't flash light. Same rule as src/theme/theme.ts.
            try {
                var theme = localStorage.getItem( 'studylog-theme' );

                if ( theme !== 'light' && theme !== 'dark' ) {
                    theme = matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch ( error ) {
                // Light, and src/theme/theme.ts tries again once the app loads.
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
