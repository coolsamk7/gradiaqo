<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Gradiaqo turns any subject into a learning path. Log your study time, track your progress and keep your streak going." />
        <meta name="theme-color" content="#0e0e0c" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- %SITE_URL% is the site's address (vite.config.ts). Link previews don't run the app, so these stay as written. -->
        <link rel="canonical" href="%SITE_URL%/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Gradiaqo" />
        <meta property="og:url" content="%SITE_URL%/" />
        <meta property="og:title" content="Gradiaqo – Study with a plan, see your progress every day" />
        <meta property="og:description" content="Turn any subject into a learning path. Log your study time, track your progress and keep your streak going." />
        <meta property="og:image" content="%SITE_URL%/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Gradiaqo: study with a plan, see your progress every day" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Gradiaqo – Study with a plan, see your progress every day" />
        <meta name="twitter:description" content="Turn any subject into a learning path. Log your study time, track your progress and keep your streak going." />
        <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
        <title>Gradiaqo – Study plans and progress tracking</title>
        <script>
            // The theme before the first paint, so dark pages don't flash light. Same rule as src/theme/theme.ts.
            try {
                var theme = localStorage.getItem( 'studylog-theme' );

                if ( theme !== 'light' && theme !== 'dark' ) {
                    theme = matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch ( error ) {
                // Light, and src/theme/theme.ts tries again once the app loads.
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
