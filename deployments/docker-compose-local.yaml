version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: gradiaqo
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: gradiaqo
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: gradiaqo
      KC_DB_PASSWORD: 123456789
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

  inngest:
    image: inngest/inngest:latest
    container_name: inngest
    command:
      - inngest
      - start
      - --event-key=superdupersecretkey
      - --signing-key=0123456789abcdef0123456789abcdef
      - -u
      - http://host.docker.internal:3200/api/inngest
    ports:
      - "8288:8288"

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
