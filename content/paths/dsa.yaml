          - leetcode: letter-combinations-of-a-phone-number
            title: "Letter Combinations of a Phone Number"
            difficulty: medium
            minutes: 35
            tags: [backtracking]
          - leetcode: generate-parentheses
            title: "Generate Parentheses"
            difficulty: medium
            minutes: 35
            tags: [backtracking]
      - title: "Permutations & Placement"
        description: "Mark what's used, recurse, unmark; prune as early as possible."
