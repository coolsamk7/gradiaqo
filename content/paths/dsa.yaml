# The Data Structures & Algorithms path. Import with: yarn cli catalog:import content/paths/dsa.yaml
# Format: content/paths/README.md. Problem titles and difficulty are LeetCode's own; minutes are estimates.

slug: dsa
title: "Data Structures & Algorithms"
description: "Interview-ready problem solving, pattern by pattern: from hash maps to dynamic programming. About 150 LeetCode problems in the order most people learn them, easy to hard inside each topic. Plan on about 3 months at an hour a day."
modules:
  - title: "Arrays & Hashing"
    description: "The building blocks: look things up in O(1), count, and walk an array once."
    topics:
      - title: "Hash Maps & Sets"
        description: "Reach for a hash map or set when you ask \"have I seen this?\", need to count, or group things by a key. It turns an O(n²) search into O(n)."
        items:
          - leetcode: contains-duplicate
            title: "Contains Duplicate"
            difficulty: easy
            minutes: 20
            tags: [arrays, hashing]
          - leetcode: valid-anagram
            title: "Valid Anagram"
            difficulty: easy
            minutes: 20
            tags: [arrays, hashing]
          - leetcode: two-sum
            title: "Two Sum"
            difficulty: easy
            minutes: 20
            tags: [arrays, hashing]
          - leetcode: group-anagrams
            title: "Group Anagrams"
            difficulty: medium
            minutes: 35
            tags: [arrays, hashing]
          - leetcode: top-k-frequent-elements
            title: "Top K Frequent Elements"
            difficulty: medium
            minutes: 35
            tags: [arrays, hashing]
          - leetcode: valid-sudoku
            title: "Valid Sudoku"
            difficulty: medium
            minutes: 35
            tags: [arrays, hashing]
          - leetcode: longest-consecutive-sequence
            title: "Longest Consecutive Sequence"
            difficulty: medium
            minutes: 35
            tags: [arrays, hashing]
      - title: "Prefix Sums & In-Place Tricks"
        description: "Precompute running totals to answer range questions in O(1), and reuse the input array itself when extra space isn't allowed."
        items:
          - leetcode: find-pivot-index
            title: "Find Pivot Index"
            difficulty: easy
            minutes: 20
            tags: [arrays, prefix-sum]
          - leetcode: product-of-array-except-self
            title: "Product of Array Except Self"
            difficulty: medium
            minutes: 35
            tags: [arrays, prefix-sum]
          - leetcode: subarray-sum-equals-k
            title: "Subarray Sum Equals K"
            difficulty: medium
            minutes: 35
            tags: [arrays, prefix-sum]
          - leetcode: first-missing-positive
            title: "First Missing Positive"
            difficulty: hard
            minutes: 60
            tags: [arrays, prefix-sum]
  - title: "Two Pointers & Sliding Window"
    description: "Two indices moving through the data instead of nested loops."
    topics:
      - title: "Two Pointers"
        description: "On sorted data, or when comparing from both ends, move one of two pointers each step; each move rules out a whole set of pairs."
        items:
          - leetcode: valid-palindrome
            title: "Valid Palindrome"
            difficulty: easy
            minutes: 20
            tags: [two-pointers]
          - leetcode: two-sum-ii-input-array-is-sorted
            title: "Two Sum II - Input Array Is Sorted"
            difficulty: medium
            minutes: 35
            tags: [two-pointers]
          - leetcode: 3sum
            title: "3Sum"
            difficulty: medium
            minutes: 35
            tags: [two-pointers]
          - leetcode: container-with-most-water
            title: "Container With Most Water"
            difficulty: medium
            minutes: 35
            tags: [two-pointers]
          - leetcode: trapping-rain-water
            title: "Trapping Rain Water"
            difficulty: hard
            minutes: 60
            tags: [two-pointers]
      - title: "Sliding Window"
        description: "For the best contiguous subarray or substring: grow the window on the right, shrink it on the left when it breaks the rule, and keep a count of what's inside."
        items:
          - leetcode: best-time-to-buy-and-sell-stock
            title: "Best Time to Buy and Sell Stock"
            difficulty: easy
            minutes: 20
            tags: [sliding-window]
          - leetcode: longest-substring-without-repeating-characters
            title: "Longest Substring Without Repeating Characters"
            difficulty: medium
            minutes: 35
            tags: [sliding-window]
          - leetcode: longest-repeating-character-replacement
            title: "Longest Repeating Character Replacement"
            difficulty: medium
            minutes: 35
            tags: [sliding-window]
          - leetcode: permutation-in-string
            title: "Permutation in String"
            difficulty: medium
            minutes: 35
            tags: [sliding-window]
          - leetcode: minimum-window-substring
            title: "Minimum Window Substring"
            difficulty: hard
            minutes: 60
            tags: [sliding-window]
          - leetcode: sliding-window-maximum
            title: "Sliding Window Maximum"
            difficulty: hard
            minutes: 60
            tags: [sliding-window]
  - title: "Stacks"
    description: "Last in, first out: matching pairs, undoing, and \"the next bigger thing\"."
    topics:
      - title: "Stack Basics"
        description: "Push what's still open, pop when it's closed: brackets, expressions, and nested structures."
        items:
          - leetcode: valid-parentheses
            title: "Valid Parentheses"
            difficulty: easy
            minutes: 20
            tags: [stack]
          - leetcode: min-stack
            title: "Min Stack"
            difficulty: medium
            minutes: 35
            tags: [stack]
          - leetcode: evaluate-reverse-polish-notation
            title: "Evaluate Reverse Polish Notation"
            difficulty: medium
            minutes: 35
            tags: [stack]
          - leetcode: decode-string
            title: "Decode String"
            difficulty: medium
            minutes: 35
            tags: [stack]
      - title: "Monotonic Stack"
        description: "Keep the stack sorted, popping what can never be the answer again: finds the next greater or smaller element for every position in O(n)."
        items:
          - leetcode: daily-temperatures
            title: "Daily Temperatures"
            difficulty: medium
            minutes: 35
            tags: [stack, monotonic-stack]
          - leetcode: car-fleet
            title: "Car Fleet"
            difficulty: medium
            minutes: 35
            tags: [stack, monotonic-stack]
          - leetcode: largest-rectangle-in-histogram
            title: "Largest Rectangle in Histogram"
            difficulty: hard
            minutes: 60
            tags: [stack, monotonic-stack]
  - title: "Binary Search"
    description: "Halve the search space each step: O(log n), on arrays and on answers."
    topics:
      - title: "Classic Binary Search"
        description: "Get the loop condition and the mid update exactly right once, and reuse them: lo ≤ hi, and move past mid."
        items:
          - leetcode: binary-search
            title: "Binary Search"
            difficulty: easy
            minutes: 20
            tags: [binary-search]
          - leetcode: search-insert-position
            title: "Search Insert Position"
            difficulty: easy
            minutes: 20
            tags: [binary-search]
          - leetcode: find-first-and-last-position-of-element-in-sorted-array
            title: "Find First and Last Position of Element in Sorted Array"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
          - leetcode: search-a-2d-matrix
            title: "Search a 2D Matrix"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
      - title: "Rotated Arrays"
        description: "One half of a rotated sorted array is always sorted: check which, then decide where the target can be."
        items:
          - leetcode: find-minimum-in-rotated-sorted-array
            title: "Find Minimum in Rotated Sorted Array"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
          - leetcode: search-in-rotated-sorted-array
            title: "Search in Rotated Sorted Array"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
      - title: "Binary Search on the Answer"
        description: "When you can check \"is x enough?\" and the answer only gets more true as x grows, binary search over x instead of over an array."
        items:
          - leetcode: koko-eating-bananas
            title: "Koko Eating Bananas"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
          - leetcode: capacity-to-ship-packages-within-d-days
            title: "Capacity To Ship Packages Within D Days"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
          - leetcode: time-based-key-value-store
            title: "Time Based Key-Value Store"
            difficulty: medium
            minutes: 35
            tags: [binary-search]
          - leetcode: split-array-largest-sum
            title: "Split Array Largest Sum"
            difficulty: hard
            minutes: 60
            tags: [binary-search]
          - leetcode: median-of-two-sorted-arrays
            title: "Median of Two Sorted Arrays"
            difficulty: hard
            minutes: 60
            tags: [binary-search]
  - title: "Linked Lists"
    description: "Pointer handling without losing a node."
    topics:
      - title: "Fast & Slow Pointers"
        description: "Two pointers at different speeds find the middle, detect cycles, and find a node n from the end, in one pass."
        items:
          - leetcode: middle-of-the-linked-list
            title: "Middle of the Linked List"
            difficulty: easy
            minutes: 20
            tags: [linked-list, two-pointers]
          - leetcode: linked-list-cycle
            title: "Linked List Cycle"
            difficulty: easy
            minutes: 20
            tags: [linked-list, two-pointers]
          - leetcode: remove-nth-node-from-end-of-list
            title: "Remove Nth Node From End of List"
            difficulty: medium
            minutes: 35
            tags: [linked-list, two-pointers]
          - leetcode: find-the-duplicate-number
            title: "Find the Duplicate Number"
            difficulty: medium
            minutes: 35
            tags: [linked-list, two-pointers]
      - title: "Rewiring Lists"
        description: "Reverse, merge and reorder by changing next pointers. A dummy head node removes most of the special cases."
        items:
          - leetcode: reverse-linked-list
            title: "Reverse Linked List"
            difficulty: easy
            minutes: 20
            tags: [linked-list]
          - leetcode: merge-two-sorted-lists
            title: "Merge Two Sorted Lists"
            difficulty: easy
            minutes: 20
            tags: [linked-list]
          - leetcode: reorder-list
            title: "Reorder List"
            difficulty: medium
            minutes: 35
            tags: [linked-list]
          - leetcode: add-two-numbers
            title: "Add Two Numbers"
            difficulty: medium
            minutes: 35
            tags: [linked-list]
          - leetcode: copy-list-with-random-pointer
            title: "Copy List with Random Pointer"
            difficulty: medium
            minutes: 35
            tags: [linked-list]
          - leetcode: reverse-nodes-in-k-group
            title: "Reverse Nodes in k-Group"
            difficulty: hard
            minutes: 60
            tags: [linked-list]
      - title: "Design with Lists"
        description: "Combine a linked list with a hash map for O(1) updates, and merge many lists with a heap."
        items:
          - leetcode: lru-cache
            title: "LRU Cache"
            difficulty: medium
            minutes: 35
            tags: [linked-list, design]
          - leetcode: merge-k-sorted-lists
            title: "Merge k Sorted Lists"
            difficulty: hard
            minutes: 60
            tags: [linked-list, design]
  - title: "Trees & Tries"
    description: "Recursion on trees, and prefix trees for words."
    topics:
      - title: "Tree Traversal"
        description: "Most tree problems are one DFS where each call returns what its parent needs (a height, a sum, a yes or no). Use BFS when the question is about levels."
        items:
          - leetcode: maximum-depth-of-binary-tree
            title: "Maximum Depth of Binary Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: invert-binary-tree
            title: "Invert Binary Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: same-tree
            title: "Same Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: subtree-of-another-tree
            title: "Subtree of Another Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: diameter-of-binary-tree
            title: "Diameter of Binary Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: balanced-binary-tree
            title: "Balanced Binary Tree"
            difficulty: easy
            minutes: 20
            tags: [trees, dfs, bfs]
          - leetcode: binary-tree-level-order-traversal
            title: "Binary Tree Level Order Traversal"
            difficulty: medium
            minutes: 35
            tags: [trees, dfs, bfs]
          - leetcode: binary-tree-right-side-view
            title: "Binary Tree Right Side View"
            difficulty: medium
            minutes: 35
            tags: [trees, dfs, bfs]
          - leetcode: count-good-nodes-in-binary-tree
            title: "Count Good Nodes in Binary Tree"
            difficulty: medium
            minutes: 35
            tags: [trees, dfs, bfs]
          - leetcode: binary-tree-maximum-path-sum
            title: "Binary Tree Maximum Path Sum"
            difficulty: hard
            minutes: 60
            tags: [trees, dfs, bfs]
      - title: "Binary Search Trees"
        description: "Everything on the left is smaller, everything on the right is larger: an in-order walk visits values in sorted order."
        items:
          - leetcode: lowest-common-ancestor-of-a-binary-search-tree
            title: "Lowest Common Ancestor of a Binary Search Tree"
            difficulty: medium
            minutes: 35
            tags: [trees, bst]
          - leetcode: validate-binary-search-tree
            title: "Validate Binary Search Tree"
            difficulty: medium
            minutes: 35
            tags: [trees, bst]
          - leetcode: kth-smallest-element-in-a-bst
            title: "Kth Smallest Element in a BST"
            difficulty: medium
            minutes: 35
            tags: [trees, bst]
      - title: "Building & Rebuilding Trees"
        description: "Build a tree from traversals, find common ancestors in any tree, and turn a tree into a string and back."
        items:
          - leetcode: lowest-common-ancestor-of-a-binary-tree
            title: "Lowest Common Ancestor of a Binary Tree"
            difficulty: medium
            minutes: 35
            tags: [trees]
          - leetcode: construct-binary-tree-from-preorder-and-inorder-traversal
