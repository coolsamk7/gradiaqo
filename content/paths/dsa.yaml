            difficulty: medium
            minutes: 35
            tags: [trees]
          - leetcode: serialize-and-deserialize-binary-tree
            title: "Serialize and Deserialize Binary Tree"
            difficulty: hard
            minutes: 60
            tags: [trees]
      - title: "Tries"
        description: "A tree of characters for prefix lookups: each node holds its children and whether a word ends there."
        items:
          - leetcode: implement-trie-prefix-tree
            title: "Implement Trie (Prefix Tree)"
            difficulty: medium
            minutes: 35
