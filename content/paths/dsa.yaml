          - leetcode: find-median-from-data-stream
            title: "Find Median from Data Stream"
            difficulty: hard
            minutes: 60
            tags: [heap]
      - title: "Scheduling with Heaps"
        description: "Pick the most urgent or most frequent thing next, and put it back when it's ready again."
        items:
          - leetcode: task-scheduler
            title: "Task Scheduler"
            difficulty: medium
            minutes: 35
            tags: [heap, greedy]
          - leetcode: design-twitter
            title: "Design Twitter"
            difficulty: medium
            minutes: 35
            tags: [heap, greedy]
  - title: "Backtracking"
    description: "Try a choice, explore, undo: every subset, permutation and placement."
    topics:
      - title: "Subsets & Combinations"
        description: "Build candidates one choice at a time, and skip equal values at the same depth to avoid duplicates."
        items:
          - leetcode: subsets
            title: "Subsets"
            difficulty: medium
            minutes: 35
            tags: [backtracking]
          - leetcode: subsets-ii
            title: "Subsets II"
            difficulty: medium
            minutes: 35
