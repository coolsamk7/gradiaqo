            minutes: 60
            tags: [trie]
  - title: "Heaps"
    description: "Always know the smallest (or largest) item, in O(log n) per change."
    topics:
      - title: "Top K & Streams"
        description: "A heap of size k keeps the k best seen so far; two heaps keep a running median."
        items:
          - leetcode: last-stone-weight
            title: "Last Stone Weight"
            difficulty: easy
            minutes: 20
            tags: [heap]
          - leetcode: kth-largest-element-in-a-stream
            title: "Kth Largest Element in a Stream"
