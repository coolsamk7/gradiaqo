name: studylog

services:
  db:
    image: postgres:17-alpine
    container_name: studylog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studylog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studylog}
      POSTGRES_DB: ${POSTGRES_DB:-studylog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends in development (and the UI tests): nothing reaches real inboxes.
  # See them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.27
    container_name: studylog-mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  db-data:
